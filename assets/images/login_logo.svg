<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Paleta de colores neutros para el gradiente (Gris oscuro a medio) -->
    <linearGradient id="eventix-grad-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />  <!-- Slate 700 -->
      <stop offset="50%" stop-color="#475569" /> <!-- Slate 600 -->
      <stop offset="100%" stop-color="#64748B" /> <!-- Slate 500 -->
    </linearGradient>

    <!-- Sombra suave neutra y discreta -->
    <filter id="soft-shadow-neutral" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    .brand-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 84px;
      fill: #1E293B; /* Slate 800 - Texto principal muy oscuro, casi negro */
      letter-spacing: -2px;
    }
    .brand-subtext {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94A3B8; /* Slate 400 - Subtexto gris medio/claro */
      letter-spacing: 6px;
      text-transform: uppercase;
    }
  </style>

  <g id="Logo-Mark" filter="url(#soft-shadow-neutral)">
    <!-- Isotipo: Estructura de Ticket / E estilizada -->
    <!-- Base del ticket / E con el gradiente neutro -->
    <path d="M 60 45 
             C 60 33.95, 68.95 25, 80 25 
             L 170 25 
             C 181.05 25, 190 33.95, 190 45 
             L 190 75 
             C 176.19 75, 165 86.19, 165 100 
             C 165 113.81, 176.19 125, 190 125 
             L 190 155 
             C 190 166.05, 181.05 175, 170 175 
             L 80 175 
             C 68.95 175, 60 166.05, 60 155 
             Z" 
          fill="url(#eventix-grad-neutral)" />

    <!-- Trazo interior que forma las barras horizontales de la "E" en blanco -->
    <!-- Barra superior -->
    <rect x="92" y="52" width="60" height="18" rx="9" fill="#FFFFFF" />
    
    <!-- Barra media con el corte de la E -->
    <rect x="92" y="91" width="48" height="18" rx="9" fill="#FFFFFF" />
    
    <!-- Barra inferior -->
    <rect x="92" y="130" width="60" height="18" rx="9" fill="#FFFFFF" />

    <!-- Pin de ubicación sutil integrado en blanco con opacidad -->
    <circle cx="168" cy="52" r="6" fill="#FFFFFF" opacity="0.85" />
  </g>

  <!-- Tipografía del Isologotipo -->
  <g id="Logo-Text">
    <!-- El texto principal es oscuro neutro, y el "ix" usa el gradiente neutro -->
    <text x="225" y="128" class="brand-text">event<tspan fill="url(#eventix-grad-neutral)">ix</tspan></text>
    <text x="230" y="162" class="brand-subtext">EVENTS &amp; TICKETS</text>
  </g>
</svg>
